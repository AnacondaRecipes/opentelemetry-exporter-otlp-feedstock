{% set name = "opentelemetry-exporter-otlp" %}
{% set version = "1.45.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 879044ba65b8b1be7a0d9d904afb76700e96d2a4d36700918d9325c9ee3b8be4

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - opentelemetry-exporter-otlp-proto-grpc =={{ version }}
    - opentelemetry-exporter-otlp-proto-http =={{ version }}

# Upstream tests import opentelemetry.test (opentelemetry-test-utils), which is not in
# the main channel; the constructor checks from tests/test_otlp.py are run below instead.
test:
  imports:
    - opentelemetry.exporter.otlp
  commands:
    - pip check
    - python -c "from opentelemetry.exporter.otlp.proto.grpc._log_exporter import OTLPLogExporter; from opentelemetry.exporter.otlp.proto.grpc.metric_exporter import OTLPMetricExporter; from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter; from opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter as HTTPSpanExporter; [cls() for cls in (OTLPSpanExporter, HTTPSpanExporter, OTLPLogExporter, OTLPMetricExporter)]"
  requires:
    - pip

about:
  home: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-otlp
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: OpenTelemetry Collector Exporters
  description: |
    This library is provided as a convenience to install all supported OpenTelemetry Collector Exporters.
  dev_url: https://github.com/open-telemetry/opentelemetry-python/tree/main/exporter/opentelemetry-exporter-otlp
  doc_url: https://github.com/open-telemetry/opentelemetry-python/blob/main/exporter/opentelemetry-exporter-otlp/README.rst

extra:
  recipe-maintainers:
    - mariusvniekerk
